<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC-IA | Centro de Operaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- BARRA SUPERIOR (SALUD DEL SISTEMA) -->
    <header class="topbar">
        <div class="logo">🛡️ SOC-IA <span class="version">v2.0</span></div>
        <div class="health-container">
            <span>Salud del Sistema:</span>
            <div class="health-bar-bg">
                <div id="health-bar" class="health-bar" style="width: 100%;"></div>
            </div>
            <span id="health-text">100%</span>
        </div>
        <div class="topbar-actions">
            <span id="conn-status" class="conn-status offline">● Sin conexión</span>
            <button id="btn-simulate" class="btn-primary">⚡ Simular Lluvia de Logs</button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL (3 PANELES) -->
    <main class="dashboard-grid">
        <!-- PANEL IZQUIERDO: AGENTES -->
        <aside class="panel agents-panel">
            <h2>🤖 Flota de Agentes</h2>
            <div id="agent-list" class="agent-list">
                <!-- Se llena con JS -->
            </div>
            <div class="panel-chart agent-chart">
                <div class="chart-head">
                    <h3>Escalados vs Atendidos</h3>
                </div>
                <canvas id="chart-agentes" role="img" aria-label="Casos escalados y atendidos por agente"></canvas>
                <div class="chart-legend">
                    <span><i class="dot escalado"></i>Escalados</span>
                    <span><i class="dot atendido"></i>Atendidos</span>
                </div>
            </div>
        </aside>

        <!-- PANEL CENTRAL: LLUVIA DE LOGS -->
        <section class="panel logs-panel">
            <h2>📡 Lluvia de Logs en Vivo</h2>
            <div id="logs-console" class="console">
                <div class="log-line system">> Esperando conexión...</div>
            </div>
            <div class="monitor-row">
                <div class="panel-chart ecg-block">
                    <div class="chart-head">
                        <h3>Signos vitales del SOC</h3>
                        <span id="ecg-reading" class="chart-reading">100%</span>
                    </div>
                    <canvas id="chart-ecg" role="img" aria-label="Salud del sistema en tiempo real"></canvas>
                </div>
                <div class="panel-chart donut-block">
                    <div class="chart-head">
                        <h3>Ataques por tipo</h3>
                    </div>
                    <div class="donut-wrap">
                        <canvas id="chart-ataques" role="img" aria-label="Proporción de ataques por tipo"></canvas>
                        <ul id="donut-legend" class="donut-legend"></ul>
                    </div>
                </div>
            </div>
        </section>

        <!-- PANEL DERECHO: CASOS ESCALADOS -->
        <aside class="panel cases-panel">
            <h2>🚨 Casos Escalados</h2>
            <div id="cases-list" class="cases-list">
                <!-- Se llena con JS -->
            </div>
        </aside>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script>
        // En Cloudflare Pages apunta al Worker desplegado.
        // En local se conserva el default de app.js (http://127.0.0.1:8787/api).
        if (!['127.0.0.1', 'localhost'].includes(location.hostname)) {
            window.SOC_API_URL = 'https://soc-ia-worker.hackaton.workers.dev/api';
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
